<!doctype html>
<html>
    <head>
        <meta charset = 'utf-8'>
        <title>Wherever you go, there you are</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    </head>
    <body>
        <form>
            <input type="button" id="watch" value="Watch me">
            <input type="button" id="clearWatch" value="Clear watch">
        </form>
        <div id="location">
            Your location will go here.
        </div>
        <div id="distance">
            Distance from College will go here.
        </div>
        <div id="map" style='height: 280px;'>
        </div>
       <form id="destForm">
  <label for="destLat">Широта</label>
  <input id="destLat" type="number" step="any" min="-90" max="90" required />

  <label for="destLng">Довгота</label>
  <input id="destLng" type="number" step="any" min="-180" max="180" required />

  <button type="submit">Задати пункт</button>
</form>
         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
        <script src ="assets/script.js"></script>
    </body>
</html>
